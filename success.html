<!DOCTYPE html>
<html>
<head>

  <script>

function getCartItemsArray() {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  return cart.map(item => ({
    product_id: item.id,
    product_name: item.name,
    product_price: item.price,
    product_color: item.color,
    product_size: item.size,
    product_qty: item.qty
  }));

}
    
  window.dataLayer = window.dataLayer || [];

  var isLoggedIn = localStorage.getItem("loggedIn") === "true";
  var userId = localStorage.getItem("userId");

  window.dataLayer.push({
    page_name: "order_success_page",
    page_url: window.location.href,
    page_category: "order_success",
    user_type: isLoggedIn ? "logged_in" : "guest",
    user_id: isLoggedIn ? userId : undefined,
    order_status: "success",
    products: getCartItemsArray(),
    timestamp: new Date().toISOString()
  });
</script>

<body class="success">
  <h1>🎉 Order Successful!</h1>
  <a href="index.html" data-cta-name="success_go_home" data-cta-location="success_page">Go Home</a>
  <script src="js/login.js"></script>


<script>

function getPurchaseItems() {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  return cart.map((item, index) => ({
    item_id: "SKU_" + item.id,
    item_name: item.name,
    affiliation: "ShopEase",
    coupon: "",
    discount: 0,
    index: index,
    item_brand: "ShopEase",
    item_category: "Apparel",
    item_category2: "General",
    item_category3: "Clothing",
    item_category4: "Standard",
    item_category5: "Default",
    item_list_id: "cart_products",
    item_list_name: "Cart Page",
    item_variant: item.color,
    location_id: "online_store",
    price: item.price,
    google_business_vertical: "retail",
    quantity: item.qty
  }));

}

window.dataLayer = window.dataLayer || [];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

// total value
let totalValue = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

// dummy values (can enhance later)
let tax = totalValue * 0.05;
let shipping = 50;
let couponValue = "";

// generate transaction id
let transactionId = "T_" + Date.now();

// 🔥 CLEAR OLD ECOMMERCE
dataLayer.push({ ecommerce: null });

// 🔥 PURCHASE EVENT
window.dataLayer.push({
  event: "purchase",
  ecommerce: {
    transaction_id: transactionId,
    value: totalValue,
    tax: tax,
    shipping: shipping,
    currency: "INR",
    coupon: couponValue,
    customer_type: localStorage.getItem("loggedIn") === "true" ? "returning" : "guest",
    items: getPurchaseItems()
  }
});

// 🔥 CLEAR CART AFTER PURCHASE
localStorage.removeItem("cart");

</script>
  
  
</body>
